[project]
name = "taller-simple-api"
version = "0.1.0"
description = "API Taller Simple — FastAPI + SQLAlchemy + PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.34.3",
    "sqlalchemy==2.0.41",
    "alembic==1.16.4",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "psycopg[binary]==3.2.9",
    "python-multipart==0.0.20",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "httpx==0.28.1",
    "anyio==4.9.0",
    "ruff==0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.alembic]
script_location = "migrations"
